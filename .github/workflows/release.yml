name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RENPY_VERSION: "8.5.3"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against game version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^define build\.version = "([^"]+)".*/\1/p' game/options.rpy)"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match build.version (v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and mount Ren'Py SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.dmg" \
            --output "$RUNNER_TEMP/renpy-sdk.dmg"
          mkdir "$RUNNER_TEMP/renpy-sdk-mount" "$RUNNER_TEMP/renpy-sdk"
          hdiutil attach "$RUNNER_TEMP/renpy-sdk.dmg" \
            -quiet -nobrowse -readonly -mountpoint "$RUNNER_TEMP/renpy-sdk-mount"
          ditto "$RUNNER_TEMP/renpy-sdk-mount/renpy-${RENPY_VERSION}-sdk" "$RUNNER_TEMP/renpy-sdk"
          hdiutil detach "$RUNNER_TEMP/renpy-sdk-mount" -quiet
          test -x "$RUNNER_TEMP/renpy-sdk/renpy.app/Contents/MacOS/renpy"
          echo "RENPY_SDK_ROOT=$RUNNER_TEMP/renpy-sdk" >> "$GITHUB_ENV"

      - name: Build macOS package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          "$RENPY_SDK_ROOT/renpy.app/Contents/MacOS/renpy" "$RENPY_SDK_ROOT/launcher" distribute "$GITHUB_WORKSPACE" \
            --package mac --dest "$RUNNER_TEMP/dists"
          asset="$RUNNER_TEMP/dists/scheuerhof-${VERSION}-mac.zip"
          test -f "$asset"
          mkdir "$RUNNER_TEMP/release-assets"
          cp "$asset" "$RUNNER_TEMP/release-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract Ren'Py SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "renpy-sdk.zip"
          Invoke-WebRequest `
            -Uri "https://www.renpy.org/dl/$env:RENPY_VERSION/renpy-$env:RENPY_VERSION-sdk.zip" `
            -OutFile $archive
          $sdkDirectory = Join-Path $env:RUNNER_TEMP "renpy-sdk"
          Expand-Archive -Path $archive -DestinationPath $sdkDirectory
          $renpyExe = Get-ChildItem -Path $sdkDirectory -Filter renpy.exe -Recurse |
            Select-Object -First 1
          if (-not $renpyExe) {
            throw "Could not find renpy.exe in the extracted SDK."
          }
          "RENPY_SDK_ROOT=$($renpyExe.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Build Windows package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "dists"
          & "$env:RENPY_SDK_ROOT\lib\py3-windows-x86_64\renpy.exe" "$env:RENPY_SDK_ROOT\launcher" distribute `
            "$env:GITHUB_WORKSPACE" --package win --dest $destination
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Ren'Py Windows build failed with exit code $LASTEXITCODE."
          }
          $asset = Join-Path $destination "scheuerhof-$env:VERSION-win.zip"
          if (-not (Test-Path $asset)) {
            throw "Expected build artifact not found: $asset"
          }
          $assets = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Path $assets | Out-Null
          Copy-Item $asset $assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  build-web:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git identity for Pages deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and extract Ren'Py SDK
        run: |
          curl --fail --location --retry 3 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2" \
            --output "$RUNNER_TEMP/renpy-sdk.tar.bz2"
          mkdir "$RUNNER_TEMP/renpy-sdk"
          tar -xjf "$RUNNER_TEMP/renpy-sdk.tar.bz2" -C "$RUNNER_TEMP/renpy-sdk"
          sdk_script="$(find "$RUNNER_TEMP/renpy-sdk" -name renpy.sh -print -quit)"
          if [[ -z "$sdk_script" ]]; then
            echo "Could not find renpy.sh in the extracted SDK." >&2
            exit 1
          fi
          echo "RENPY_SDK_ROOT=$(dirname "$sdk_script")" >> "$GITHUB_ENV"

      - name: Download Ren'Py web support
        run: |
          curl --fail --location --retry 3 \
            "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-web.zip" \
            --output "$RUNNER_TEMP/renpy-web.zip"
          unzip -q "$RUNNER_TEMP/renpy-web.zip" -d "$RENPY_SDK_ROOT"
          test -f "$RENPY_SDK_ROOT/web/index.html"

      - name: Build and deploy web version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tools/deploy_web_pages.sh "$RENPY_SDK_ROOT" --build
          site="$GITHUB_WORKSPACE/scheuerhof-${VERSION}-dists"
          test -f "$site/index.html"
          mkdir "$RUNNER_TEMP/release-assets"
          (cd "$site" && zip -qr "$RUNNER_TEMP/release-assets/scheuerhof-${VERSION}-web.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  publish-release:
    needs:
      - validate
      - build-macos
      - build-windows
      - build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f "release-assets/scheuerhof-${VERSION}-mac.zip"
          test -f "release-assets/scheuerhof-${VERSION}-win.zip"
          test -f "release-assets/scheuerhof-${VERSION}-web.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --title "Der Fluch von Scheuerhof v${VERSION}" \
              --generate-notes
          fi
